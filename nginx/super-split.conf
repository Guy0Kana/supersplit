# SuperSplit Nginx config for supersplit.tech
# Install: sudo cp ~/super-split/nginx/super-split.conf /etc/nginx/sites-available/<your-site-file>
# Needs /etc/nginx/.htpasswd (sudo htpasswd -c /etc/nginx/.htpasswd admin), then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name supersplit.tech www.supersplit.tech staging.supersplit.tech admin.supersplit.tech;
    return 301 https://$host$request_uri;
}

# Public site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supersplit.tech www.supersplit.tech;

    ssl_certificate     /etc/letsencrypt/live/supersplit.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supersplit.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The admin API is only reachable from the admin subdomain
    location /api/admin/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin: same app, with an extra Nginx password in front of the app's own admin login
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.supersplit.tech;

    ssl_certificate     /etc/letsencrypt/live/supersplit.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supersplit.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    auth_basic "Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / { return 302 https://admin.supersplit.tech/#admin; }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Staging: separate app on port 3002, password-protected and hidden from search engines
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.supersplit.tech;

    ssl_certificate     /etc/letsencrypt/live/supersplit.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supersplit.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
