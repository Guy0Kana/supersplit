# Replace yourdomain.tech with your real domain. Put in /etc/nginx/sites-available/super-split,
# symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# Step 1: use the HTTP blocks only until ZeroSSL issues certificates, then enable the TLS blocks.

server {
  listen 80;
  server_name yourdomain.tech www.yourdomain.tech admin.yourdomain.tech;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 80;
  server_name staging.yourdomain.tech;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

# --- TLS (enable after certificates exist) ---
server {
  listen 443 ssl;
  http2 on;
  server_name yourdomain.tech www.yourdomain.tech admin.yourdomain.tech;
  ssl_certificate     /etc/ssl/super-split/fullchain.pem;
  ssl_certificate_key /etc/ssl/super-split/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 50k;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name staging.yourdomain.tech;
  ssl_certificate     /etc/ssl/super-split/fullchain.pem;
  ssl_certificate_key /etc/ssl/super-split/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 50k;

  location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
